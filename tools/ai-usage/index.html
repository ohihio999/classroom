<!DOCTYPE html>
<!--
  AI 額度儀表板 — 三大 AI CLI 月訂閱使用量
  版號：v1.3.0
  版更記錄：
  - v1.3.0 (2026-07-28) 手機常駐三改：①「已 X 分鐘未更新」改用計時器每 30 秒自己重算（原本只在收到新資料時才算，
    電腦關機後數字會凍住、看起來像剛更新）②可「加到主畫面」全螢幕常駐（manifest.json + sw.js）＋螢幕恆亮開關
    （Screen Wake Lock，設定記在 localStorage，切回前景自動重新取得）③Codex 卡片改依 collect.ps1 的 source 欄位
    顯示：api＝即時查詢，session＝取自最近一次使用（會標示可能已過期）
  - v1.2.0 (2026-07-14) Gemini 卡片接真實額度（retrieveUserQuota 逐模型剩餘比例）：有用量的模型顯示進度條，全 0% 收斂成一行
  - v1.1.0 (2026-07-13) 配合 Codex 0.134 改版：某窗口無數據時顯示說明，不再顯示錯置數字
  - v1.0.0 (2026-07-12) 初版：Claude / Codex 官方額度即時顯示（Firestore onSnapshot），Gemini 官方連結卡片
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 額度儀表板</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 額度">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --hairline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --track:       #eeede8;
    --fill-normal: #2a78d6;
    --fill-warn:   #fab219;
    --fill-crit:   #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --hairline:    #2c2c2a;
      --border:      rgba(255,255,255,0.10);
      --track:       #2c2c2a;
      --fill-normal: #3987e5;
      --fill-warn:   #fab219;
      --fill-crit:   #d03b3b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--page);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 8px 0 2px; }
  .sub { color: var(--ink-muted); font-size: 0.8rem; margin-bottom: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .card-head h2 { font-size: 1rem; font-weight: 700; flex: 1; }
  .badge {
    font-size: 0.7rem; color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 8px;
  }
  .meter { margin-bottom: 14px; }
  .meter:last-child { margin-bottom: 2px; }
  .meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .meter-label { font-size: 0.85rem; color: var(--ink-2); }
  .meter-val { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--fill-normal); transition: width 0.4s ease; }
  .bar-fill.warn { background: var(--fill-warn); }
  .bar-fill.crit { background: var(--fill-crit); }
  .meter-reset { font-size: 0.72rem; color: var(--ink-muted); margin-top: 4px; }
  .state-note { font-size: 0.85rem; color: var(--ink-2); line-height: 1.6; }
  .err { color: var(--fill-crit); font-size: 0.85rem; }
  .link-btn {
    display: block; text-align: center; text-decoration: none;
    margin-top: 12px; padding: 10px;
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--ink); font-size: 0.9rem; font-weight: 600;
  }
  .link-btn:active { background: var(--track); }
  .wake {
    display: none; width: 100%; margin-top: 4px; padding: 11px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--ink-2); font-size: 0.85rem; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  .wake.on { color: var(--ink); border-color: var(--fill-normal); }
  .wake:active { background: var(--track); }
  footer {
    text-align: center; color: var(--ink-muted);
    font-size: 0.75rem; line-height: 1.7; margin: 20px 0 8px;
  }
  .stale { color: var(--fill-crit); font-weight: 600; }
  .loading { text-align: center; color: var(--ink-muted); padding: 40px 0; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 額度儀表板</h1>
  <div class="sub">Claude / Codex / Gemini 官方額度・電腦開機時每 5 分鐘更新</div>
  <div id="app"><div class="loading">載入中…</div></div>
  <footer id="foot"></footer>
  <button id="wake" class="wake" type="button">螢幕保持開啟：關</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBf0sHTsndFCksNlh46G_2mw9rk5zmPdc0",
  authDomain: "my-teaching-tools-2b36c.firebaseapp.com",
  projectId: "my-teaching-tools-2b36c",
  storageBucket: "my-teaching-tools-2b36c.firebasestorage.app",
  messagingSenderId: "82693897353",
  appId: "1:82693897353:web:f667501aad05c536c09a58"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $app = document.getElementById("app");
const $foot = document.getElementById("foot");

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function meter(label, m) {
  if (!m || m.percent == null) return "";
  const p = Math.max(0, Math.min(100, Number(m.percent)));
  const cls = p >= 90 ? "crit" : p >= 70 ? "warn" : "";
  const reset = m.resetsAt ? `<div class="meter-reset">重置 ${fmtTime(m.resetsAt)}</div>` : "";
  return `<div class="meter">
    <div class="meter-top"><span class="meter-label">${label}</span><span class="meter-val">${p}%</span></div>
    <div class="bar"><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
    ${reset}
  </div>`;
}

function card(title, badge, body) {
  const b = badge ? `<span class="badge">${badge}</span>` : "";
  return `<section class="card"><div class="card-head"><h2>${title}</h2>${b}</div>${body}</section>`;
}

function render(data) {
  let html = "";

  const c = data.claude || {};
  html += card("Claude", "", c.status === "ok"
    ? meter("5 小時窗口", c.fiveHour) + meter("週額度（全部）", c.sevenDay) + (c.model ? meter(`週額度（${c.model.name}）`, c.model) : "")
    : `<div class="err">讀取失敗：${c.error || "無資料"}</div>`);

  const x = data.codex || {};
  // source：api＝每輪即時向 Codex 查（不必先用過 Codex）；session＝回退去翻 session 檔，數字可能是舊的
  const xNote = !x.asOf ? ""
    : x.source === "api"
      ? `<div class="meter-reset">即時查詢 ${fmtTime(x.asOf)}</div>`
      : `<div class="meter-reset stale">數據時間 ${fmtTime(x.asOf)}（取自最近一次 Codex 使用，可能已過期）</div>`;
  html += card("Codex", x.planType ? x.planType.toUpperCase() : "", x.status === "ok"
    ? meter("5 小時窗口", x.fiveHour) + meter("週額度", x.sevenDay)
      + (!x.fiveHour && x.sevenDay ? `<div class="state-note">此版 Codex 僅回報週額度，無 5 小時窗口數據。</div>` : "")
      + xNote
    : `<div class="err">讀取失敗：${x.error || "無資料"}</div>`);

  const g = data.gemini || {};
  let gBody;
  if (g.status === "ok" && Array.isArray(g.models) && g.models.length) {
    const used = g.models.filter(m => m.percent > 0).sort((a, b) => b.percent - a.percent);
    const zeros = g.models.length - used.length;
    gBody = used.map(m => meter(m.name.replace(/^gemini-/, ""), m)).join("");
    if (used.length === 0) {
      gBody += `<div class="state-note">全部 ${g.models.length} 個模型今日 0%</div>`
        + (g.models[0].resetsAt ? `<div class="meter-reset">重置 ${fmtTime(g.models[0].resetsAt)}</div>` : "");
    } else if (zeros > 0) {
      gBody += `<div class="meter-reset">其餘 ${zeros} 個模型 0%</div>`;
    }
  } else if (g.status === "error") {
    gBody = `<div class="err">讀取失敗：${g.error || "無資料"}</div>`;
  } else {
    gBody = `<div class="state-note">尚無 Gemini 數據，等收集腳本下一輪更新。</div>`;
  }
  html += card("Gemini", g.tier ? g.tier.toUpperCase().replace("-TIER", "") : "", gBody);

  $app.innerHTML = html;
  lastCollectedAt = data.collectedAt || null;
  renderFoot();
}

// 頁尾要靠計時器自己重算：只在收到新資料時算的話，電腦一關機數字就凍住，
// 畫面看起來像剛更新過，反而看不出已經停更（這是常駐看最容易誤判的地方）。
let lastCollectedAt = null;
function renderFoot() {
  if (!lastCollectedAt) return;
  const t = new Date(lastCollectedAt);
  if (isNaN(t)) return;
  const mins = Math.round((Date.now() - t.getTime()) / 60000);
  const staleTag = mins > 15 ? ` <span class="stale">（已 ${mins} 分鐘未更新，電腦可能沒開機）</span>` : "";
  $foot.innerHTML = `更新時間 ${fmtTime(lastCollectedAt)}${staleTag}`;
}
setInterval(renderFoot, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderFoot(); });

onSnapshot(doc(db, "ai_usage", "current"), snap => {
  if (!snap.exists()) {
    $app.innerHTML = `<div class="loading">還沒有數據，請先在電腦上跑一次收集腳本。</div>`;
    return;
  }
  try {
    render(JSON.parse(snap.data().data || "{}"));
  } catch (e) {
    $app.innerHTML = `<div class="err">數據解析失敗：${e.message}</div>`;
  }
}, err => {
  $app.innerHTML = `<div class="err">Firestore 連線失敗：${err.message}</div>`;
});

// ---------- 常駐用：螢幕恆亮開關 ----------
// Wake Lock 一離開前景就會被系統釋放，所以要記住使用者的選擇並在回前景時重新取得。
const $wake = document.getElementById("wake");
let wakeLock = null;
let wantWake = localStorage.getItem("aiUsageWakeLock") === "1";

function paintWake(msg) {
  $wake.textContent = msg || (wantWake ? "螢幕保持開啟：開" : "螢幕保持開啟：關");
  $wake.classList.toggle("on", wantWake);
}

async function acquireWake() {
  if (wakeLock || document.hidden) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
    paintWake();
  } catch (e) {
    paintWake(`無法保持螢幕開啟（${e.name}）`);
  }
}

if ("wakeLock" in navigator) {
  $wake.style.display = "block";
  paintWake();
  $wake.addEventListener("click", async () => {
    wantWake = !wantWake;
    localStorage.setItem("aiUsageWakeLock", wantWake ? "1" : "0");
    if (wantWake) {
      await acquireWake();
    } else {
      if (wakeLock) { try { await wakeLock.release(); } catch {} wakeLock = null; }
      paintWake();
    }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && wantWake) acquireWake(); });
  if (wantWake) acquireWake();
}

// ---------- 加到主畫面用 ----------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
