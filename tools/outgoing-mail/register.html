<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <h1>登記寄件</h1>
  <button class="back-btn" onclick="location.href='/'" style="margin-left:auto">🏠</button>
</div>

<div class="content">

  <!-- 信封 -->
  <div class="section">
    <div class="section-title">✉️ 信封照片（每封一張）</div>
    <div id="envelopeSlots"></div>
    <button class="add-envelope-btn" onclick="addEnvelopeSlot()">＋ 新增信封</button>
  </div>

  <!-- 收執聯 -->
  <div class="section">
    <div class="section-title">🧾 收執聯（一張對應全部）</div>
    <img id="receiptPreview" class="photo-preview" alt="">
    <div id="receiptPlaceholder" class="photo-placeholder">
      <div class="ph-icon">🧾</div>
      <div class="ph-label">郵局收執聯</div>
    </div>
    <div class="photo-btns">
      <label class="btn btn-camera" for="receiptCamera">📷 拍照</label>
      <label class="btn btn-gallery" for="receiptGallery">🖼️ 相簿</label>
    </div>
    <input type="file" id="receiptCamera" accept="image/*" capture="environment">
    <input type="file" id="receiptGallery" accept="image/*">
  </div>

  <!-- 一次辨識 -->
  <button class="btn-ocr-all" id="ocrAllBtn" onclick="runBatchOCR()" disabled>✨ 一次辨識全部</button>
  <div class="ocr-status" id="ocrStatus"></div>

  <!-- 辨識結果 -->
  <div id="resultsSection">
    <div style="height:16px"></div>
    <div class="results-heading">📋 辨識結果（可編輯）</div>
    <div id="recordsList"></div>
    <button class="btn-save-all" id="saveAllBtn" onclick="saveAll()">💾 儲存全部</button>
  </div>

  <div style="height:32px"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-functions.js';
import { getStorage, ref, uploadString, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js';

const firebaseConfig = { apiKey:"AIzaSyBf0sHTsndFCksNlh46G_2mw9rk5zmPdc0", authDomain:"my-teaching-tools-2b36c.firebaseapp.com", projectId:"my-teaching-tools-2b36c", storageBucket:"my-teaching-tools-2b36c.firebasestorage.app", messagingSenderId:"82693897353", appId:"1:82693897353:web:f667501aad05c536c09a58" };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const functions = getFunctions(app, 'asia-east1');
const ocrFn = httpsCallable(functions, 'ocrEnvelope');
const SENDER_OPTIONS = [
  '林玉鈴 (Kanny)', '黃志堅 (Charles)', '林毓婷 (Cherrie)', '黃義正 (Jacky)',
  '吳翊平 (Yibi)', '曾書彥 (Norika)', '王儷蓉 (Lisa)', '許世佑 (Seal)',
  '陳佳興 (Steven)', '陳姵存 (Kelly)', '林宥燁 (Yedda)', '林逸昇 (Eason)',
  '蘇彥霖 (Russell)', '鍾文綺 (Hina)', '石博仁 (Seki)', '潘怡穎 (Daisy)',
  '台精精密股份有限公司 (Seiko Instruments Taiwan Inc.)'
];

// ── State ──────────────────────────────────────────
let receiptBase64 = null;
let envelopeSlots = [];
let slotCounter = 0;
let records = [];

// ── Receipt inputs ─────────────────────────────────
['receiptCamera','receiptGallery'].forEach(id => {
  document.getElementById(id).addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    receiptBase64 = await compress(file);
    const preview = document.getElementById('receiptPreview');
    preview.src = 'data:image/jpeg;base64,' + receiptBase64;
    preview.style.display = 'block';
    document.getElementById('receiptPlaceholder').style.display = 'none';
  });
});

// ── Envelope slots ─────────────────────────────────
window.addEnvelopeSlot = function() {
  const id = ++slotCounter;
  envelopeSlots.push({ id, base64: null });
  renderSlots();
};

window.removeEnvelopeSlot = function(id) {
  envelopeSlots = envelopeSlots.filter(s => s.id !== id);
  renderSlots();
  updateOcrBtn();
};

function renderSlots() {
  const container = document.getElementById('envelopeSlots');
  container.innerHTML = '';
  envelopeSlots.forEach((slot, idx) => {
    const div = document.createElement('div');
    div.className = 'envelope-slot';
    div.innerHTML = `
      <div class="envelope-slot-header">
        <span>信封 ${idx + 1}</span>
        ${envelopeSlots.length > 1
          ? `<button class="remove-btn" onclick="removeEnvelopeSlot(${slot.id})">✕</button>`
          : ''}
      </div>
      ${slot.base64
        ? `<img src="data:image/jpeg;base64,${slot.base64}" class="photo-preview" style="display:block" alt="">`
        : `<div class="photo-placeholder"><div class="ph-icon">✉️</div><div class="ph-label">信封正面</div></div>`
      }
      <div class="photo-btns">
        <label class="btn btn-camera" for="envCam_${slot.id}">📷 拍照</label>
        <label class="btn btn-gallery" for="envGal_${slot.id}">🖼️ 相簿</label>
      </div>
      <input type="file" id="envCam_${slot.id}" accept="image/*" capture="environment">
      <input type="file" id="envGal_${slot.id}" accept="image/*">
    `;
    container.appendChild(div);
    [`envCam_${slot.id}`, `envGal_${slot.id}`].forEach(inputId => {
      document.getElementById(inputId).addEventListener('change', async e => {
        const file = e.target.files[0]; if (!file) return;
        const b64 = await compress(file);
        const s = envelopeSlots.find(s => s.id === slot.id);
        if (s) { s.base64 = b64; renderSlots(); updateOcrBtn(); }
      });
    });
  });
}

function updateOcrBtn() {
  document.getElementById('ocrAllBtn').disabled = !envelopeSlots.some(s => s.base64);
}

// init
addEnvelopeSlot();

// ── Batch OCR ──────────────────────────────────────
const ENVELOPE_PROMPT = '這是一封信封的正面。請辨識以下欄位，以純 JSON 回傳（不加 markdown）：{"recipientName":"收件人公司或單位","recipientDept":"部門（若無填空）","recipientContact":"聯絡人姓名（若無填空）","recipientAddress":"完整收件地址（含縣市）","content":"信件內容說明（若有標示，否則填空）"}。找不到的欄位填空字串。';
const RECEIPT_PROMPT = '這是一張寄件單據，可能是台灣郵局收執聯／執據，也可能是「全球快遞 Global Express」的託運單，請先判斷是哪一種再抓掛號號碼。\n\n【若是全球快遞 Global Express 託運單】（單據左上角有 Global Express 圖示或「全球快遞」字樣）：掛號號碼請抓「託運單號：」這個標籤右邊那一串純數字（例如 託運單號：4007991724 → 抓 4007991724），原樣連續輸出、不要加空格分組。絕對不要抓左邊手寫的「會編」（如 A0452138）、也不要抓右邊條碼下方的數字。這種單通常只有一筆，items 只回一筆即可。\n\n【若是台灣郵局收執聯／執據】（限時掛號、普通掛號、掛號包裹執據，可能多筆）：請優先辨識收據上方那一排掛號號碼，不要把旁邊的「號」字、地址郵遞區號、電話、重量、郵資、單號等其他數字混進去。台灣國內這幾種單據的掛號號碼是 20 碼純數字，空格分組固定為 6-6-2-5-1，例如：917120 100067 20 11000 6、974081 100067 10 40200 0、920996 100067 70 33300 9。如果是國際掛號，才是 13 碼格式：2個英文字母＋9位數字＋2個英文字母。收執聯下方明細表最右欄是「本件郵資」，每筆掛號各自不同，請逐筆抓取，不要用最上方的總應收現金代替。\n\n請以純 JSON 回傳（不加 markdown）：{"items":[{"trackingNumber":"完整掛號號碼／託運單號。郵局 20 碼請保留 6-6-2-5-1 空格格式，13 碼請原樣正確輸出，全球快遞託運單號請原樣連續純數字不分組","destination":"目的地城市或區域，從地址判斷，例如台北市、台中市、高雄市、桃園市龜山區","postage":"本件郵資欄的數字（元），每筆各自抓，找不到填空"}],"date":"日期 YYYY-MM-DD（民國年轉西元）","postage":"總郵費備用（找不到填空）"}。依序列出所有掛號／託運單號，找不到的欄位填空字串。';

window.runBatchOCR = async function() {
  const btn = document.getElementById('ocrAllBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 辨識中…';
  showStatus('辨識中，請稍候…');

  try {
    const today = new Date().toISOString().split('T')[0];

    // 所有信封並行辨識
    const envelopePromises = envelopeSlots
      .filter(s => s.base64)
      .map(s => ocrFn({ imageBase64: s.base64, mimeType: 'image/jpeg', prompt: ENVELOPE_PROMPT })
        .then(r => r.data || {})
        .catch(e => ({ __ocrError: e.message || '信封辨識失敗' })));

    // 收執聯辨識
    let receiptData = { items: [], date: today, postage: '' };
    if (receiptBase64) {
      try {
        const r = await ocrFn({ imageBase64: receiptBase64, mimeType: 'image/jpeg', prompt: RECEIPT_PROMPT });
        const d = r.data || {};
        receiptData = {
          items: normalizeReceiptItems(Array.isArray(d.items) ? d.items : []),
          date: d.date || today,
          postage: d.postage || ''
        };
      } catch(e) {
        throw new Error('收執聯辨識失敗：' + (e.message || '請稍後再試'));
      }
    }

    const envResults = await Promise.all(envelopePromises);
    const failedIndex = envResults.findIndex(env => env.__ocrError);
    if (failedIndex >= 0) {
      throw new Error(`信封 ${failedIndex + 1} 辨識失敗：${envResults[failedIndex].__ocrError}`);
    }

    // 合併：依地址智慧配對掛號號碼，配不到再依序補
    const items = [...receiptData.items];
    const assigned = new Array(envResults.length).fill(null);
    const assignedPostage = new Array(envResults.length).fill('');
    const usedIdx = new Set();

    // 第一輪：地址包含目的地城市的直接配對
    envResults.forEach((env, i) => {
      const addr = (env.recipientAddress || '').toLowerCase();
      for (let j = 0; j < items.length; j++) {
        if (usedIdx.has(j)) continue;
        const dest = (items[j].destination || '').toLowerCase();
        if (dest && addr.includes(dest)) {
          assigned[i] = normalizeTracking(items[j].trackingNumber || '');
          assignedPostage[i] = items[j].postage || '';
          usedIdx.add(j);
          break;
        }
      }
    });

    // 第二輪：未配對的依序填剩餘號碼
    let nextJ = 0;
    envResults.forEach((_, i) => {
      if (assigned[i] !== null) return;
      while (nextJ < items.length && usedIdx.has(nextJ)) nextJ++;
      if (nextJ < items.length) {
        assigned[i] = normalizeTracking(items[nextJ].trackingNumber || '');
        assignedPostage[i] = items[nextJ].postage || '';
      } else {
        assigned[i] = '';
      }
      usedIdx.add(nextJ); nextJ++;
    });

    records = envResults.map((env, i) => ({
      trackingNumber: normalizeTracking(assigned[i] || ''),
      senderNames: [],
      senderName: '',
      recipientName: env.recipientName || '',
      recipientDept: env.recipientDept || '',
      recipientContact: env.recipientContact || '',
      recipientAddress: env.recipientAddress || '',
      content: env.content || '',
      type: '信函',
      date: today,
      postage: assignedPostage[i] || receiptData.postage,
      notes: '',
      status: 'sent'
    }));

    renderRecords();
    document.getElementById('resultsSection').style.display = 'block';
    showStatus(`✅ 辨識完成，共 ${records.length} 筆，請確認後儲存`, 'success');
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
  } catch(e) {
    showStatus('❌ ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ 一次辨識全部';
    updateOcrBtn();
  }
};

// ── Render editable records ────────────────────────
function renderRecords() {
  const container = document.getElementById('recordsList');
  container.innerHTML = '';
  records.forEach((rec, i) => {
    const div = document.createElement('div');
    div.className = 'record-card';
    div.innerHTML = `
      <div class="record-card-title">第 ${i + 1} 封</div>
      <div class="form-group"><label>掛號號碼</label><input id="r${i}_trackingNumber" value="${esc(formatTracking(rec.trackingNumber))}" style="font-family:'Courier New',monospace;letter-spacing:1px"></div>
      <div class="form-group"><label>收件公司/單位</label><input id="r${i}_recipientName" value="${esc(rec.recipientName)}"></div>
      <div class="form-row">
        <div class="form-group"><label>部門</label><input id="r${i}_recipientDept" value="${esc(rec.recipientDept)}"></div>
        <div class="form-group"><label>聯絡人</label><input id="r${i}_recipientContact" value="${esc(rec.recipientContact)}"></div>
      </div>
      <div class="form-group"><label>收件地址</label><input id="r${i}_recipientAddress" value="${esc(rec.recipientAddress)}"></div>
      <div class="form-group">
        <label>寄件人</label>
        <div class="picker-value ${rec.senderNames?.length ? '' : 'empty'}" id="r${i}_senderDisplay">${esc(getSenderDisplay(rec.senderNames, rec.senderName) || '請選擇寄件人')}</div>
        ${renderSenderOptions(i)}
      </div>
      <div class="form-group"><label>內容/用途</label><input id="r${i}_content" value="${esc(rec.content)}"></div>
      <div class="form-row">
        <div class="form-group"><label>類別</label>
          <select id="r${i}_type">
            <option value="信函" ${rec.type==='信函'?'selected':''}>信函</option>
            <option value="包裹" ${rec.type==='包裹'?'selected':''}>包裹</option>
            <option value="其他" ${rec.type==='其他'?'selected':''}>其他</option>
          </select>
        </div>
        <div class="form-group"><label>郵費（元）</label><input id="r${i}_postage" value="${esc(rec.postage)}"></div>
      </div>
      <div class="form-group"><label>寄出日期</label><input type="date" id="r${i}_date" value="${esc(rec.date)}"></div>
      <div class="form-group"><label>備註</label><input id="r${i}_notes" value="${esc(rec.notes)}"></div>
    `;
    container.appendChild(div);
  });
}

// ── Save all ───────────────────────────────────────
window.saveAll = async function() {
  const btn = document.getElementById('saveAllBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  const fields = ['trackingNumber','recipientName','recipientDept','recipientContact','recipientAddress','content','type','postage','date','notes'];
  try {
    const envelopeImgs = envelopeSlots.filter(s => s.base64);
    const ts = Date.now();
    const writes = records.map(async (_, i) => {
      const data = { status: 'sent', createdAt: serverTimestamp() };
      fields.forEach(f => { data[f] = (document.getElementById(`r${i}_${f}`)?.value || '').trim(); });
      const senderNames = Array.isArray(records[i].senderNames) ? records[i].senderNames : [];
      data.senderNames = senderNames;
      data.senderName = senderNames.join('、');
      const imgPath = `outgoing_mail/${ts}_${i}`;
      if (receiptBase64) {
        const rRef = ref(storage, `${imgPath}/receipt.jpg`);
        await uploadString(rRef, receiptBase64, 'base64', { contentType: 'image/jpeg' });
        data.receiptImageUrl = await getDownloadURL(rRef);
      }
      if (envelopeImgs[i]?.base64) {
        const eRef = ref(storage, `${imgPath}/envelope.jpg`);
        await uploadString(eRef, envelopeImgs[i].base64, 'base64', { contentType: 'image/jpeg' });
        data.envelopeImageUrl = await getDownloadURL(eRef);
      }
      return addDoc(collection(db, 'outgoing_mail'), data);
    });
    await Promise.all(writes);
    location.href = 'index.html';
  } catch(e) {
    alert('儲存失敗：' + e.message);
    btn.disabled = false; btn.innerHTML = '💾 儲存全部';
  }
};

// ── Utils ──────────────────────────────────────────
function showStatus(msg, type = '') {
  const el = document.getElementById('ocrStatus');
  el.textContent = msg;
  el.className = 'ocr-status' + (type ? ' ' + type : '');
}

function esc(str) {
  return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function getSenderDisplay(senderNames, fallback = '') {
  if (Array.isArray(senderNames) && senderNames.length) return senderNames.join('、');
  return fallback || '';
}

function renderSenderOptions(index) {
  const selectedNames = records[index]?.senderNames || [];
  return `
    <div class="sender-options">
      <div class="sender-options-label">請點選寄件人：</div>
      <div class="sender-chips">
        ${SENDER_OPTIONS.map(name => `<button type="button" class="sender-chip ${selectedNames.includes(name) ? 'selected' : ''}" onclick="toggleSenderName(${index}, '${esc(name)}')">${esc(name)}</button>`).join('')}
      </div>
    </div>
  `;
}

function syncRecordFromInputs(index) {
  const rec = records[index];
  if (!rec) return;
  ['trackingNumber','recipientName','recipientDept','recipientContact','recipientAddress','content','type','postage','date','notes'].forEach(field => {
    const el = document.getElementById(`r${index}_${field}`);
    if (el) rec[field] = el.value.trim();
  });
}

window.toggleSenderName = function(index, name) {
  syncRecordFromInputs(index);
  if (!records[index]) return;
  const senderNames = Array.isArray(records[index].senderNames) ? [...records[index].senderNames] : [];
  const nextNames = senderNames.includes(name)
    ? senderNames.filter(item => item !== name)
    : [...senderNames, name];
  records[index].senderNames = nextNames;
  records[index].senderName = nextNames.join('、');
  const display = document.getElementById(`r${index}_senderDisplay`);
  if (display) {
    display.textContent = getSenderDisplay(nextNames) || '請選擇寄件人';
    display.classList.toggle('empty', !nextNames.length);
  }
  renderRecords();
};

function normalizeReceiptItems(items) {
  return items.map(item => ({
    ...item,
    trackingNumber: normalizeTracking(item?.trackingNumber || ''),
    destination: (item?.destination || '').trim()
  })).filter(item => item.trackingNumber);
}

function normalizeTracking(value) {
  const raw = String(value || '').trim().toUpperCase();
  if (!raw) return '';

  const compact = raw.replace(/號$/u, '').replace(/[^A-Z0-9]/g, '');
  const domestic = compact.match(/^(\d{6})(\d{6})(\d{2})(\d{5})(\d)$/);
  if (domestic) return `${domestic[1]} ${domestic[2]} ${domestic[3]} ${domestic[4]} ${domestic[5]}`;

  const international = compact.match(/^([A-Z]{2})(\d{3})(\d{3})(\d{3})([A-Z]{2})$/);
  if (international) return `${international[1]} ${international[2]} ${international[3]} ${international[4]} ${international[5]}`;

  return raw;
}

function formatTracking(num) {
  return normalizeTracking(num);
}

function compress(file) {
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1200; let w = img.width, h = img.height;
      if (w > MAX) { h = h * MAX / w; w = MAX; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.src = url;
  });
}
</script>
