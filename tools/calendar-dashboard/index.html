<script type="module">

const config={apiKey:'AIzaSyBf0sHTsndFCksNlh46G_2mw9rk5zmPdc0',authDomain:'my-teaching-tools-2b36c.firebaseapp.com',projectId:'my-teaching-tools-2b36c',storageBucket:'my-teaching-tools-2b36c.firebasestorage.app',messagingSenderId:'82693897353',appId:'1:82693897353:web:f667501aad05c536c09a58'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),EMAIL='ohihio@gmail.com';

function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return new Date(d).toISOString()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateText(d){return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(d)}
function apiDate(ev,key){const point=key==='start'?ev.start:ev.end;return point?.dateTime||point?.date}
function eventMeta(ev){const text=ev.description||'';const block=text.match(/<!-- classroom-calendar-meta\s*([\s\S]*?)-->/i)?.[1]||'';const get=k=>block.match(new RegExp('^'+k+'\\s*=\\s*(.+)$','mi'))?.[1]?.trim()||'';return {application:get('application')||'未分類',priority:get('priority')||''}}
function withMeta(desc,meta){const clean=(desc||'').replace(/\s*<!-- classroom-calendar-meta[\s\S]*?-->\s*/gi,'\n').trim();return `${clean}${clean?'\n\n':''}<!-- classroom-calendar-meta\napplication=${meta.application}\npriority=${meta.priority}\n-->`}
function workClass(ev){const s=new Date(apiDate(ev,'start')),e=new Date(apiDate(ev,'end'));let work=false,after=false;for(let d=new Date(s);d<e;d.setDate(d.getDate()+1)){const day=d.getDay();if(day===0||day===6){after=true;continue}const ds=new Date(d);ds.setHours(9,0,0,0);const de=new Date(d);de.setHours(18,0,0,0);const a=Math.max(s,ds),b=Math.min(e,de);if(a<b)work=true;const c=Math.max(s,de),f=Math.min(e,new Date(d).setHours(23,59,59,999));if(c<f)after=true}return work&&after?'跨時段':work?'上班時段':'下班時段'}
async function oauth(){const provider=new GoogleAuthProvider();provider.addScope('https://www.googleapis.com/auth/calendar');provider.setCustomParameters({login_hint:EMAIL});const result=await signInWithPopup(auth,provider);return GoogleAuthProvider.credentialFromResult(result)?.accessToken||''}
async function getJson(url,token){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});const body=await r.text();if(!r.ok){const err=new Error(`${r.status} ${body||r.statusText}`);err.status=r.status;err.body=body;throw err}return body?JSON.parse(body):{}}
async function load(){
  $('error').classList.add('hidden');$('refresh').disabled=true;$('status').textContent='正在讀取 Google Calendar…';
  try{if(!state.token)state.token=await oauth();const cs=await getJson(`${API}/users/me/calendarList?maxResults=250`,state.token);state.calendars=cs.items||[];const min=new Date(),max=addDays(min,30);const events=[];for(const c of state.calendars){let page='';do{const q=new URLSearchParams({timeMin:iso(min),timeMax:iso(max),singleEvents:'true',orderBy:'startTime',showDeleted:'false',maxResults:'250',...(page?{pageToken:page}:{})});const data=await getJson(`${API}/calendars/${encodeURIComponent(c.id)}/events?${q}`,state.token);(data.items||[]).forEach(ev=>{ev._calendarId=c.id;ev._calendarName=c.summary||c.id;events.push(ev)});page=data.nextPageToken||''}while(page)}state.events=events.filter(e=>e.start?.dateTime&&e.end?.dateTime);populateCalendars();render();$('status').textContent=`更新於 ${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}，共 ${state.events.length} 筆`}
  catch(e){console.error(e);state.token='';let hint='';if(e.status===401)hint='請重新按「更新行程」取得新的 Google Calendar 授權。';else if(e.status===403)hint='請確認 Google Cloud 已啟用 Google Calendar API，並在授權視窗允許 Calendar 權限。';else hint='請把下方完整錯誤文字提供給管理者。';$('error').textContent=`載入失敗（HTTP ${e.status||'未知'}）\n${e.body||e.message}\n\n處理建議：${hint}`;$('error').classList.remove('hidden');$('status').textContent='載入失敗'}finally{$('refresh').disabled=false}
}
function populateCalendars(){const old=$('calendarFilter').value;$('calendarFilter').innerHTML='<option value="">全部日曆</option>'+state.calendars.map(c=>`<option value="${esc(c.id)}">${esc(c.summary||c.id)}</option>`).join('');$('calendarFilter').value=old}

function addInlineStatusControls(){document.querySelectorAll('.event').forEach(item=>{item.querySelector('.registration-control')?.remove();if(item.querySelector('.inline-status-control'))return;const ev=state.events.find(x=>x.id===item.dataset.id&&x._calendarId===item.dataset.calendar);if(!ev)return;const m=eventMeta(ev),wrap=document.createElement('span');wrap.className='inline-status-control';wrap.innerHTML=`<select class="inline-select inline-application" aria-label="申請狀態"><option value="待申請">待申請</option><option value="已申請">已申請</option></select><select class="inline-select inline-registration" aria-label="報名狀態"><option value="未選擇">未選擇</option><option value="已報名">已報名</option><option value="未報名">未報名</option></select><button type="button" class="inline-save">存檔</button>`;wrap.querySelector('.inline-application').value=m.application==='已申請'?'已申請':'待申請';wrap.querySelector('.inline-registration').value=m.registration;item.querySelector('.event-links')?.before(wrap)})}

async function saveInlineStatus(item,button){const ev=state.events.find(x=>x.id===item.dataset.id&&x._calendarId===item.dataset.calendar);if(!ev)return;button.disabled=true;try{if(!state.token)state.token=await oauth();const application=item.querySelector('.inline-application').value,registration=item.querySelector('.inline-registration').value,data=JSON.parse(JSON.stringify(ev));delete data._calendarId;delete data._calendarName;data.description=withMeta(data.description,{...eventMeta(ev),application,registration});const r=await fetch(`${API}/calendars/${encodeURIComponent(ev._calendarId)}/events/${encodeURIComponent(ev.id)}`,{method:'PUT',headers:{Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);ev.description=data.description;await setDoc(doc(db,'calendar_dashboard_cache',encodeURIComponent(`${ev._calendarId}__${ev.id}`)),{calendarId:ev._calendarId,eventId:ev.id,event:data,application,registration,syncedAt:serverTimestamp()},{merge:true});button.textContent='已存檔';setTimeout(()=>button.textContent='存檔',1200)}catch(e){alert(`儲存失敗：${e.message}`)}finally{button.disabled=false}}
document.addEventListener('click',e=>{const b=e.target.closest('.inline-save');if(b){e.stopImmediatePropagation();saveInlineStatus(b.closest('.event'),b);return}if(e.target.closest('.inline-select')){e.stopImmediatePropagation();return}if(e.target.closest('.event')&&!e.target.closest('a,.lamp,.status-light'))e.stopImmediatePropagation()},true);
function addStatusLights(){document.querySelectorAll('.event').forEach(item=>{if(item.querySelector('.status-lights'))return;const ev=state.events.find(x=>x.id===item.dataset.id&&x._calendarId===item.dataset.calendar);if(!ev)return;item.querySelector('.inline-status-control')?.remove();item.querySelector('.priority-lamps')?.remove();const m=eventMeta(ev),groups=[[['application','未分類','gray','待申請'],['application','已申請','green','已申請']],[['registration','未選擇','gray','未選擇'],['registration','未報名','red','未報名'],['registration','已報名','blue','已報名']],[['review','未選擇','gray','審核未設定'],['review','審核中','yellow','審核中'],['review','審核通過','green','審核通過'],['review','未通過','red','未通過']],[['priority','','gray','低優先'],['priority','值得參加','orange','一般優先'],['priority','必去','red','最高優先']]],wrap=document.createElement('span');wrap.className='status-lights';groups.forEach(group=>group.forEach(([type,value,color,label])=>{const b=document.createElement('button');b.type='button';b.className=`status-light ${color} ${m[type]===value?'selected':''}`;b.dataset.type=type;b.dataset.value=value;b.title=label;b.setAttribute('aria-label',label);wrap.append(b)}));item.querySelector('.event-links')?.before(wrap)})}

async function saveStatusLight(item,light){const ev=state.events.find(x=>x.id===item.dataset.id&&x._calendarId===item.dataset.calendar);if(!ev)return;const m=eventMeta(ev),type=light.dataset.type,value=light.dataset.value;m[type]=m[type]===value?(type==='application'?'未分類':type==='registration'||type==='review'?'未選擇':''):value;try{if(!state.token)state.token=await oauth();const data=JSON.parse(JSON.stringify(ev));delete data._calendarId;delete data._calendarName;data.description=withMeta(data.description,m);const r=await fetch(`${API}/calendars/${encodeURIComponent(ev._calendarId)}/events/${encodeURIComponent(ev.id)}`,{method:'PUT',headers:{Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);ev.description=data.description;await setDoc(doc(db,'calendar_dashboard_cache',encodeURIComponent(`${ev._calendarId}__${ev.id}`)),{calendarId:ev._calendarId,eventId:ev.id,event:data,syncedAt:serverTimestamp()},{merge:true});render()}catch(e){alert(`儲存失敗：${e.message}`)}}
document.addEventListener('click',e=>{const light=e.target.closest('.status-light');if(!light)return;e.stopImmediatePropagation();saveStatusLight(light.closest('.event'),light)},true);document.addEventListener('click',e=>{if(e.target.closest('.event')&&!e.target.closest('a,.status-light'))e.stopImmediatePropagation()},true);document.addEventListener('click',e=>{if(e.target.closest('a'))e.stopImmediatePropagation()},true);
function addStatusLabels(){document.querySelectorAll('.status-lights').forEach(wrap=>{if(wrap.querySelector('.status-group'))return;const item=wrap.closest('.event'),ev=state.events.find(x=>x.id===item?.dataset.id&&x._calendarId===item?.dataset.calendar);if(!ev)return;const m=eventMeta(ev),names={application:m.application==='已申請'?'已申請':m.application==='未分類'?'—':'待申請',registration:m.registration==='已報名'?'已報名':m.registration==='未報名'?'未報名':'—',review:['審核中','審核通過','未通過'].includes(m.review)?m.review:'—',priority:m.priority==='必去'?'最高優先':m.priority==='值得參加'?'一般優先':m.priority==='可略過'?'低優先':'—'};const lights=[...wrap.querySelectorAll('.status-light')];wrap.innerHTML='';['application','registration','review','priority'].forEach(type=>{const group=document.createElement('span');group.className='status-group';const title=document.createElement('span');title.className='status-name';title.textContent={application:'申請',registration:'報名',review:'審核',priority:'優先'}[type];group.append(title);lights.filter(x=>x.dataset.type===type).forEach(x=>group.append(x));const label=document.createElement('span');label.className='status-label';label.textContent=names[type];group.append(label);wrap.append(group)})})}
